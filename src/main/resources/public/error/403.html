<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - 접근 권한이 없습니다 | 마주한끼</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fdfbf7;
            color: #2d3748;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #f1ece1;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #d69e2e;
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }
        .error-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 15px;
            color: #718096;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn-home {
            display: inline-block;
            background-color: #e05638;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(224, 86, 56, 0.25);
        }
        .btn-home:hover {
            background-color: #c94427;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(224, 86, 56, 0.35);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">403</div>
        <h1 class="error-title">접근 권한이 없습니다</h1>
        <p class="error-desc">
            요청하신 페이지에 접근할 수 있는 권한이 부족합니다.<br>
            계정 권한을 확인하시거나 홈으로 이동해 주세요.
        </p>
        <a href="https://majuhankki.pages.dev/" id="btn-home" class="btn-home">마주한끼 홈으로 돌아가기</a>
    </div>
    <script>
        (function() {
            const btn = document.getElementById('btn-home');
            if (btn && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
                btn.href = 'http://localhost:3000';
            }
        })();
    </script>
</body>
</html>
