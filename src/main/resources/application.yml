spring:
  application:
    name: project2

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

    group:
      dev:
        - ai
        - auth
        - db
      prod:
        - ai
        - auth
        - db

  config:
    import: optional:file:.env[.properties]

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 외부 또는 운영 Redis 사용하기 시작할 때 추가 사항
#      username: ${REDIS_USERNAME:}
#      password: ${REDIS_PASSWORD:}
#      database: 0
#      timeout: 3s
#      ssl:
#        enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  storage:
    bucket: ${SUPABASE_S3_BUCKET:${SUPABASE_STORAGE_BUCKET:user-profiles}}
    endpoint: ${SUPABASE_S3_ENDPOINT:}
    region: ${SUPABASE_S3_REGION:ap-northeast-2}
    access-key: ${SUPABASE_S3_ACCESS_KEY:}
    secret-key: ${SUPABASE_S3_SECRET_KEY:}
    public-base-url: ${SUPABASE_STORAGE_PUBLIC_BASE_URL:}
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}
  matching:
    waiting-ttl: 5m
    default-search-radius-meters: 3000
    waiting-reconcile-delay: 5s
    waiting-reconcile-initial-delay: 30s
    proposal-search-delay: 5s
    proposal-search-initial-delay: 30s
    proposal-reconcile-delay: 1s
    proposal-reconcile-initial-delay: 30s
  review:
    audit:
      pseudonym-key: ${REVIEW_AUDIT_PSEUDONYM_KEY:}
      pseudonym-key-version: ${REVIEW_AUDIT_PSEUDONYM_KEY_VERSION:dev-ephemeral}
