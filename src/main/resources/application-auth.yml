app:
  auth:
    password:
      encoding-id: argon2
    jwt:
      issuer: ${JWT_ISSUER:project2}
      audience: ${JWT_AUDIENCE:project2-api}
      secret-key: ${JWT_SECRET}
      access-token-expiry: 15m
      refresh-token-expiry: 14d
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:}

