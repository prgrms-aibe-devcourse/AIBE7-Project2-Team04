app:
  auth:
    password:
      encoding-id: argon2
    jwt:
      issuer: ${JWT_ISSUER:project2}
      audience: ${JWT_AUDIENCE:project2-api}
      secret-key: ${JWT_SECRET}
      access-token-expiry: 15m
      refresh-token-expiry: 14d
      max-active-sessions: ${AUTH_MAX_ACTIVE_SESSIONS:5}
      cleanup-retention: ${AUTH_CLEANUP_RETENTION:7d}
      cleanup-cron: ${AUTH_CLEANUP_CRON:0 0 4 * * *}
    cors:
      allowed-origin: ${FRONTEND_ORIGIN}
    oauth2:
      success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/oauth/callback}

spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy-kakao-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy-kakao-client-secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, profile_image, account_email
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile, email
            client-name: Google
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
